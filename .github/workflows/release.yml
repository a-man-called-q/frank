name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            builder: cargo
          - runner: macos-14
            target: aarch64-apple-darwin
            builder: cargo
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            builder: cargo
          - runner: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            builder: cross
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            builder: cargo
          - runner: windows-2022
            target: aarch64-pc-windows-msvc
            builder: cargo

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89
          targets: ${{ matrix.target }}
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Install cross
        if: matrix.builder == 'cross'
        run: cargo install cross --version 0.2.5 --locked
      # `cross` supplies the aarch64-musl linker inside its pinned container;
      # the remaining targets use the runner's native Cargo toolchain.
      - name: Build
        env:
          # Repository variable contains only the public half. The private
          # signing key is intentionally unavailable to build jobs.
          FRANK_UPDATE_PUBLIC_KEY_B64: ${{ vars.FRANK_UPDATE_PUBLIC_KEY_B64 }}
        run: ${{ matrix.builder }} build --locked --release --target ${{ matrix.target }} -p frank-cli -p frank-server -p frank-updater
      - name: Package
        shell: bash
        run: cargo run --locked --release -p xtask -- dist --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: frank-${{ matrix.target }}
          path: |
            dist/frank-${{ matrix.target }}.tar.gz
            dist/frank-${{ matrix.target }}.zip

  release-gate:
    name: release strict gate
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - name: Install pinned verification tools
        run: |
          cargo install cargo-nextest --version 0.9.100 --locked
          cargo install cargo-llvm-cov --version 0.6.18 --locked
          cargo install cargo-deny --version 0.18.3 --locked
          cargo install cargo-audit --version 0.22.0 --locked
          cargo install cargo-mutants --version 25.3.1 --locked
      - name: Run the complete mandatory gate before publishing
        env:
          FRANK_MUTATION_TIMEOUT: '120'
        run: |
          moon run frank-scrutiny:strict
          ./scripts/mutation-gate.sh

  publish:
    needs: [build, release-gate]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          artifacts=( *.tar.gz *.zip )
          ((${#artifacts[@]} > 0)) || { echo 'no release artifacts found' >&2; exit 1; }
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${artifacts[@]}" | sort -k2 > SHA256SUMS
          else
            shasum -a 256 "${artifacts[@]}" | sort -k2 > SHA256SUMS
          fi
      - name: Release CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT HUP INT TERM
          archive="$(find dist -maxdepth 1 -name 'frank-x86_64-unknown-linux-musl.tar.gz' -print -quit)"
          [[ -n "$archive" ]] || { echo 'Linux x86_64 CLI archive is required for release smoke' >&2; exit 1; }
          tar -xzf "$archive" -C "$smoke_root"
          FRANK_SMOKE_BINARY="$smoke_root/frank" FRANK_SMOKE_APPLY=1 ./scripts/package-smoke.sh
      - name: Generate and sign update manifest
        shell: bash
        env:
          FRANK_UPDATE_PRIVATE_KEY_B64: ${{ secrets.FRANK_UPDATE_PRIVATE_KEY_B64 }}
          FRANK_UPDATE_PUBLIC_KEY_B64: ${{ vars.FRANK_UPDATE_PUBLIC_KEY_B64 }}
        run: |
          set -euo pipefail
          ./scripts/build-update-manifest.sh
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Frank 1.0 release. OS packages are intentionally unsigned; verify
            `SHA256SUMS` and the detached Frank update signature before use.
            Gatekeeper and SmartScreen may show an unsigned-package warning.
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/frank-update-v1.json
            dist/frank-update-v1.json.minisig
