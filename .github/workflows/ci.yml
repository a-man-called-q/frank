name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict:
    name: mandatory strict gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned proto/Moon
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Install Rust verification tools
        run: |
          cargo install cargo-nextest --version 0.9.100 --locked
          cargo install cargo-llvm-cov --version 0.6.18 --locked
          cargo install cargo-deny --version 0.18.3 --locked
          cargo install cargo-audit --version 0.22.0 --locked

      - name: Validate Moon graph
        run: moon query projects

      - name: Run mandatory PR gate
        env:
          FRANK_MUTATION_TIMEOUT: '120'
        run: moon run frank-scrutiny:strict

      - name: Upload Rust coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-report
          path: target/llvm-cov/frank-summary.json
          if-no-files-found: warn

  frank-desktop-analyze:
    name: frank-desktop:analyze
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned proto/Moon
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Analyze Flutter desktop
        run: moon run frank-desktop:analyze

  frank-desktop-test:
    name: frank-desktop:test
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned proto/Moon
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Test Flutter desktop
        run: moon run frank-desktop:test

  frank-desktop-build:
    name: frank-desktop:build
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned proto/Moon
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Build Flutter macOS debug app
        run: moon run frank-desktop:build

  frank-desktop-scene-smoke:
    name: frank-desktop:scene-smoke
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned proto/Moon
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Run Flutter GPU scene smoke
        run: moon run frank-desktop:scene-smoke
