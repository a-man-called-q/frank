name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict:
    name: mandatory strict gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned proto/Moon
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust verification tools
        run: |
          cargo install cargo-nextest --version 0.9.100 --locked
          cargo install cargo-llvm-cov --version 0.6.18 --locked
          cargo install cargo-deny --version 0.18.3 --locked
          cargo install cargo-audit --version 0.22.0 --locked

      - name: Frozen JavaScript install
        run: pnpm install --frozen-lockfile

      - name: Install browser dependencies for the strict GUI gate
        run: pnpm --dir apps/frank-gui exec playwright install --with-deps chromium

      - name: Validate Moon graph
        run: moon query projects

      - name: Run mandatory PR gate
        env:
          FRANK_MUTATION_TIMEOUT: '120'
        run: moon run frank-scrutiny:strict

      - name: Upload Rust coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-report
          path: target/llvm-cov/frank-summary.json
          if-no-files-found: warn

  frontend-browser:
    name: frontend rendered/accessibility smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/frank-gui exec playwright install --with-deps chromium
      - run: pnpm --dir apps/frank-gui test --coverage

  installer-edge-smoke:
    name: CLI installer edge cases
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/installer-smoke.sh
