$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'unknown'
stack: 'infrastructure'

tasks:
  strict:
    command: './scripts/verify-strict.sh'
    inputs:
      - '/Cargo.toml'
      - '/Cargo.lock'
      - '/.config/**/*'
      - '/crates/**/*'
      - '/apps/frank-gui/src/**/*'
      - '/apps/frank-gui/src-tauri/**/*'
      - '/apps/frank-gui/index.html'
      - '/apps/frank-gui/*.json'
      - '/apps/frank-gui/*.ts'
      - '/scripts/**/*'
      - '/xtask/**/*'
    options:
      runFromWorkspaceRoot: true
      cache: false

  nightly:
    command: './scripts/scrutiny-nightly.sh'
    deps: ['~:strict']
    options:
      runFromWorkspaceRoot: true
      cache: false
