$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'unknown'
stack: 'infrastructure'

tasks:
  bundle:
    command: './scripts/build-release.sh'
    inputs:
      - '/Cargo.toml'
      - '/Cargo.lock'
      - '/apps/frank-gui/**/*'
      - '/crates/**/*'
      - '/dist/**/*'
      - '/scripts/**/*'
    options:
      runFromWorkspaceRoot: true
      cache: false

  checksums:
    command: 'cargo run --locked -p xtask -- checksums'
    deps: ['~:bundle']
    options:
      runFromWorkspaceRoot: true
      cache: false

  smoke:
    command: './scripts/package-smoke.sh'
    deps: ['~:checksums']
    options:
      runFromWorkspaceRoot: true
      cache: false

  native-smoke:
    command: './scripts/native-smoke.sh'
    options:
      runFromWorkspaceRoot: true
      cache: false
