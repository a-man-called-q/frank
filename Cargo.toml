[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Julius Brussee"]
repository = "https://github.com/JuliusBrussee/frank"

[workspace.dependencies]
frank-safeio = { path = "crates/frank-safeio" }
frank-pack = { path = "crates/frank-pack" }
frank-state = { path = "crates/frank-state" }
frank-ledger = { path = "crates/frank-ledger" }
frank-compress = { path = "crates/frank-compress" }
frank-target = { path = "crates/frank-target" }
frank-mcp = { path = "crates/frank-mcp" }
frank-app = { path = "crates/frank-app" }
frank-release-cli = { path = "crates/frank-release-cli" }
proptest = "1"

clap = { version = "4", features = ["derive"] }
clap_complete = "4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
rustix = { version = "0.38", features = ["fs", "process"] }
sha2 = "0.10"
anyhow = "1"
thiserror = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.dev]
panic = "unwind"
