[workspace]
resolver = "3"
members = ["backend/crates/*", "backend/xtask"]
exclude = ["fuzz"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
authors = ["Julius Brussee"]
repository = "https://github.com/a-man-called-q/frank"

[workspace.dependencies]
frank-safeio = { path = "backend/crates/frank-safeio", version = "1.0.0" }
frank-credential = { path = "backend/crates/frank-credential", version = "1.0.0" }
frank-service = { path = "backend/crates/frank-service", version = "1.0.0" }
frank-pack = { path = "backend/crates/frank-pack", version = "1.0.0" }
frank-state = { path = "backend/crates/frank-state", version = "1.0.0" }
frank-ledger = { path = "backend/crates/frank-ledger", version = "1.0.0" }
frank-compress = { path = "backend/crates/frank-compress", version = "1.0.0" }
frank-target = { path = "backend/crates/frank-target", version = "1.0.0" }
frank-mcp = { path = "backend/crates/frank-mcp", version = "1.0.0" }
frank-app = { path = "backend/crates/frank-app", version = "1.0.0" }
frank-protocol = { path = "backend/crates/frank-protocol", version = "1.0.0" }
frank-store = { path = "backend/crates/frank-store", version = "1.0.0" }
frank-agent = { path = "backend/crates/frank-agent", version = "1.0.0" }
frank-orchestrator = { path = "backend/crates/frank-orchestrator", version = "1.0.0" }
frank-server = { path = "backend/crates/frank-server", version = "1.0.0" }
frank-client = { path = "backend/crates/frank-client", version = "1.0.0" }
frank-agent-mcp = { path = "backend/crates/frank-agent-mcp", version = "1.0.0" }
frank-tool-catalog = { path = "backend/crates/frank-tool-catalog", version = "1.0.0" }
frank-toolchain = { path = "backend/crates/frank-toolchain", version = "1.0.0" }
frank-runner = { path = "backend/crates/frank-runner", version = "1.0.0" }
frank-update = { path = "backend/crates/frank-update", version = "1.0.0" }
frank-release-cli = { path = "backend/crates/frank-release-cli", version = "1.0.0" }
proptest = "1"

clap = { version = "4", features = ["derive"] }
clap_complete = "4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
rustix = { version = "0.38", features = ["fs", "process"] }
sha2 = "0.10"
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["serde", "v4"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "net", "io-util", "io-std", "signal"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "json"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-native-roots", "connect"] }
futures-util = "0.3"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "postgres", "runtime-tokio-rustls", "json", "uuid"] }
hex = "0.4"
portable-pty = "0.9"
rustls = "0.23"
rustls-pemfile = "2"
rcgen = "0.12"
getrandom = "0.3"
base64 = "0.22"
ring = "0.17"
libc = "0.2"
argon2 = "0.5"


[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.dev]
panic = "unwind"
