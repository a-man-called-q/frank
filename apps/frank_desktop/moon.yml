$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'unknown'
stack: 'frontend'

tasks:
  get:
    command: 'proto run flutter -- pub get'
    inputs:
      - '/.prototools'
      - '/apps/frank_desktop/.flutter-version'
      - '/apps/frank_desktop/pubspec.yaml'
      - '/apps/frank_desktop/pubspec.lock'
      - '/apps/frank_desktop/hook/**/*'
      - '/apps/frank_desktop/flutter_scene_generated/**/*'
    options:
      cache: false

  analyze:
    command: 'proto run flutter -- analyze'
    deps: ['~:get']
    inputs:
      - '/apps/frank_desktop/analysis_options.yaml'
      - '/apps/frank_desktop/lib/**/*'
      - '/apps/frank_desktop/test/**/*'
      - '/apps/frank_desktop/hook/**/*'
      - '/apps/frank_desktop/flutter_scene_generated/**/*'
      - '/apps/frank_desktop/pubspec.yaml'
      - '/apps/frank_desktop/pubspec.lock'
    options:
      cache: false

  test:
    command: 'proto run flutter -- test --reporter compact'
    deps: ['~:get']
    inputs:
      - '/apps/frank_desktop/analysis_options.yaml'
      - '/apps/frank_desktop/lib/**/*'
      - '/apps/frank_desktop/test/**/*'
      - '/apps/frank_desktop/hook/**/*'
      - '/apps/frank_desktop/flutter_scene_generated/**/*'
      - '/apps/frank_desktop/pubspec.yaml'
      - '/apps/frank_desktop/pubspec.lock'
    options:
      cache: false

  build:
    command: 'proto run flutter -- build macos --debug'
    deps: ['~:get']
    inputs:
      - '/apps/frank_desktop/macos/Flutter/*.xcconfig'
      - '/apps/frank_desktop/macos/Flutter/GeneratedPluginRegistrant.swift'
      - '/apps/frank_desktop/macos/Runner/**/*.swift'
      - '/apps/frank_desktop/macos/Runner/**/*.plist'
      - '/apps/frank_desktop/macos/Runner/**/*.entitlements'
      - '/apps/frank_desktop/macos/Runner.xcodeproj/project.pbxproj'
      - '/apps/frank_desktop/macos/Runner.xcworkspace/contents.xcworkspacedata'
      - '/apps/frank_desktop/macos/RunnerTests/**/*.swift'
      - '/apps/frank_desktop/macos/Podfile'
      - '/apps/frank_desktop/macos/Podfile.lock'
      - '/apps/frank_desktop/assets/**/*'
      - '/apps/frank_desktop/hook/**/*'
      - '/apps/frank_desktop/flutter_scene_generated/**/*'
      - '/apps/frank_desktop/lib/**/*'
      - '/apps/frank_desktop/pubspec.yaml'
      - '/apps/frank_desktop/pubspec.lock'
    options:
      cache: false

  scene-smoke:
    command: 'proto run flutter -- test integration_test/office_scene_smoke_test.dart -d macos --reporter compact'
    deps: ['~:get']
    inputs:
      - '/apps/frank_desktop/macos/Flutter/*.xcconfig'
      - '/apps/frank_desktop/macos/Flutter/GeneratedPluginRegistrant.swift'
      - '/apps/frank_desktop/macos/Runner/**/*.swift'
      - '/apps/frank_desktop/macos/Runner/**/*.plist'
      - '/apps/frank_desktop/macos/Runner/**/*.entitlements'
      - '/apps/frank_desktop/macos/Runner.xcodeproj/project.pbxproj'
      - '/apps/frank_desktop/macos/Runner.xcworkspace/contents.xcworkspacedata'
      - '/apps/frank_desktop/macos/RunnerTests/**/*.swift'
      - '/apps/frank_desktop/macos/Podfile'
      - '/apps/frank_desktop/macos/Podfile.lock'
      - '/apps/frank_desktop/assets/**/*'
      - '/apps/frank_desktop/hook/**/*'
      - '/apps/frank_desktop/flutter_scene_generated/**/*'
      - '/apps/frank_desktop/integration_test/**/*'
      - '/apps/frank_desktop/lib/**/*'
      - '/apps/frank_desktop/pubspec.yaml'
      - '/apps/frank_desktop/pubspec.lock'
    options:
      cache: false

  character-smoke:
    command: 'proto run flutter -- test integration_test/frank_character_scene_smoke_test.dart -d macos --reporter compact'
    deps: ['~:get']
    inputs:
      - '/apps/frank_desktop/macos/Flutter/*.xcconfig'
      - '/apps/frank_desktop/macos/Flutter/GeneratedPluginRegistrant.swift'
      - '/apps/frank_desktop/macos/Runner/**/*.swift'
      - '/apps/frank_desktop/macos/Runner/**/*.plist'
      - '/apps/frank_desktop/macos/Runner/**/*.entitlements'
      - '/apps/frank_desktop/macos/Runner.xcodeproj/project.pbxproj'
      - '/apps/frank_desktop/macos/Runner.xcworkspace/contents.xcworkspacedata'
      - '/apps/frank_desktop/macos/RunnerTests/**/*.swift'
      - '/apps/frank_desktop/macos/Podfile'
      - '/apps/frank_desktop/macos/Podfile.lock'
      - '/apps/frank_desktop/assets/**/*'
      - '/apps/frank_desktop/hook/**/*'
      - '/apps/frank_desktop/flutter_scene_generated/**/*'
      - '/apps/frank_desktop/integration_test/**/*'
      - '/apps/frank_desktop/lib/**/*'
      - '/apps/frank_desktop/pubspec.yaml'
      - '/apps/frank_desktop/pubspec.lock'
    options:
      cache: false

  run:
    command: 'proto run flutter -- run -d macos'
    options:
      cache: false
      persistent: true
      runInCI: false

  run-configured:
    command: 'proto run flutter -- run -d macos --dart-define-from-file=.env'
    deps: ['~:get']
    options:
      cache: false
      persistent: true
      runInCI: false

  build-configured:
    command: 'proto run flutter -- build macos --debug --dart-define-from-file=.env'
    deps: ['~:get']
    options:
      cache: false
