name: frank_desktop
description: Flutter desktop client prototype for the Frank agent operations office.
publish_to: none
version: 1.0.0-dev.1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_gpu:
    sdk: flutter
  hooks: 2.0.0
  macos_window_utils: 1.9.1
  flutter_scene: 0.23.0
  flow_ui: 0.2.0
  forui: 0.25.0
  flutter_bloc: 9.1.1
  material_ui: 1.1.0
  shared_preferences: 2.5.5
  vector_math: 2.4.2

dev_dependencies:
  bloc_test: 10.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  config:
    # Keep the macOS host on Flutter's classic framework integration for now.
    # SPM remains a future packaging choice once the release pipeline is ready.
    enable-swift-package-manager: false
  assets:
    - assets/branding/frank-logo.png
    - assets/fonts/Geist-Variable.ttf
    - flutter_scene_generated/

  fonts:
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Variable.ttf
