# cargo-deny is a release gate. Keep the policy explicit so a new registry,
# license, advisory, or duplicate dependency cannot enter unnoticed.

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # OSI-approved, FSF-free permissive license (Boost C++ libraries). First
  # pulled in by the frank-gui -> iced migration: iced_winit ->
  # window_clipboard -> clipboard-win/error-code (Windows clipboard access).
  # No copyleft, no binary-distribution notice requirement -- same category
  # as MIT/Zlib below, just historically unseen in the Tauri graph.
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
ignore = true
registries = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
