# ---------------------------------------------------------------------------
# Frank 1.0 crates, registered at their first measured baseline.
#
# These nine were never in this file. The checker fails closed on any package
# present in the report without a table ("report contains an unknown workspace
# package"), so the coverage step could not pass from the moment it was able to
# run at all -- which, between the stale frank-gui-core entry, the 1.88 toolchain
# pins and the undeclared llvm-tools-preview component, was never.
#
# The numbers below are measured, not chosen, and several are bad. They are
# recorded honestly rather than aspirationally: a floor set where the code
# actually is will catch the next regression, where an invented one would only
# fail and get argued down. The 90/90/95 targets are the same for every crate
# here, so each ceiling ratchets from a real starting point.
#
# This is a baseline, not an endorsement. Nothing here should stay this low.
# ---------------------------------------------------------------------------

