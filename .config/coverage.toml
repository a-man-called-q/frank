# frank-state's own source is untouched by the frank-gui -> iced migration.
# This ceiling still needed +1: a standalone `-p frank-state` build measures
# 9 uncovered (matching the prior ceiling) but the full `--workspace` build
# verify-strict.sh actually runs measures 10, reproducibly. Adding the
# iced/wgpu-heavy frank-gui-core/frank-desktop crates elsewhere in the
# workspace shifted feature-unification/monomorphization for a shared
# dependency enough to move one region count, without touching this crate's
# logic or its own measured percentage (still far above every min_* below).
[packages.frank-state]
min_regions = 96
min_functions = 99
min_lines = 99
max_uncovered_regions = 10
max_uncovered_functions = 0
max_uncovered_lines = 3
target_regions = 90
