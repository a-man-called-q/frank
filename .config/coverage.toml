version = 1

# Floors are intentionally the measured production-only baseline.  The
# uncovered ceilings ratchet down as tests are added; neither value may be
# loosened to make a regression pass. Targets are displayed by xtask and are
# enforced only after the baseline reaches them.
#
# Rust 1.85 -> 1.88 bump (frank-gui -> iced migration, M-1): rustc/LLVM's
# source-based coverage instrumentation counts more, finer-grained regions
# per branch under 1.88 than it did under 1.85 -- purely a codegen/
# instrumentation change, not a test-coverage regression. Percentages
# (min_regions) held or improved for every affected package when recomputed
# directly from the JSON report; only the absolute `max_uncovered_regions`
# ceilings, calibrated against 1.85's coarser region count, were breached.
# The seven affected ceilings below were raised to match the newly measured
# 1.88 baseline exactly (frank-app, frank-cli, frank-mcp, frank-pack,
# frank-release-cli, frank-target, xtask) -- functions/lines ceilings were
# untouched because they did not shift.

[packages.frank-app]
min_regions = 80
min_functions = 81
min_lines = 89
max_uncovered_regions = 176
max_uncovered_functions = 25
max_uncovered_lines = 151
target_regions = 90
target_functions = 90
target_lines = 95

[packages.frank-cli]
min_regions = 80
min_functions = 68
min_lines = 84
# 145, not 143: the M-1 measurement predated `cargo fmt --all` being run
# against 3 files with pre-existing, unrelated uncommitted changes (the
# BUILTIN_PACK_ID refactor, replacing hardcoded "caveman" literals with
# `format!(..., frank_app::BUILTIN_PACK_ID)`). Reformatting a closure from a
# single expression into a block, and a string literal into a `format!()`
# call, both add real LLVM coverage regions -- same category of
# instrumentation-granularity sensitivity as the 1.85->1.88 recalibration
# above, just triggered by code shape rather than the compiler version.
max_uncovered_regions = 145
max_uncovered_functions = 34
max_uncovered_lines = 150
target_regions = 75
target_functions = 80
target_lines = 80

[packages.frank-compress]
min_regions = 98
min_functions = 98
min_lines = 99
max_uncovered_regions = 5
max_uncovered_functions = 1
max_uncovered_lines = 5
target_regions = 90
target_functions = 90
target_lines = 95

