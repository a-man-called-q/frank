version = 1

# Floors are intentionally the measured production-only baseline.  The
# uncovered ceilings ratchet down as tests are added; neither value may be
# loosened to make a regression pass. Targets are displayed by xtask and are
# enforced only after the baseline reaches them.

[packages.frank-app]
min_regions = 80
min_functions = 81
min_lines = 89
max_uncovered_regions = 127
max_uncovered_functions = 25
max_uncovered_lines = 151
target_regions = 90
target_functions = 90
target_lines = 95

