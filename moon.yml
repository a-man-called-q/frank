$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'unknown'
stack: 'infrastructure'
workspace:
  inheritedTasks:
    include: []

# `cache: false` throughout: these are thin wrappers that shell out to the
# frank-rust and frank-scrutiny projects, so caching them would cache a
# delegation rather than any real work. See .moon/projects/frank-rust/moon.yml.

tasks:
  verify:
    command: 'moon run frank-rust:verify'
    options:
      runFromWorkspaceRoot: true
      cache: false

  verify-strict:
    command: 'moon run frank-scrutiny:strict'
    options:
      runFromWorkspaceRoot: true
      cache: false

  nightly:
    command: 'moon run frank-scrutiny:nightly'
    options:
      runFromWorkspaceRoot: true
      cache: false
